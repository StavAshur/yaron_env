# Create with:  distrobox assemble create --file ~/catkin_ws/env/distrobox.ini
# Enter with:   distrobox enter noetic
# Distrobox already gives the container host network, /dev (USB, GPU) and the X/Wayland socket.
[noetic]
image=local/ros-noetic-motoman:latest
pull=false
init=false
# Phase 2 (ZED camera, after a supported NVIDIA GPU + host driver are installed): set nvidia=true
nvidia=false
# Phase 3 (Bota EtherCAT) may need realtime limits, e.g.:
#   additional_flags="--ulimit rtprio=99:99 --cap-add=SYS_NICE"
